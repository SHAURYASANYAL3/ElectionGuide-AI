<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectionGuide India</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background-color: #faf9f5;
      color: #141413;
    }
    button {
      font-family: inherit;
    }
    input, select, textarea {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const { ChevronRight, MapPin, Clock, CheckCircle, BookOpen, Zap, Users, Lightbulb } = lucide;

    function ElectionGuideIndia() {
      const [currentMode, setCurrentMode] = useState(null);
      const [currentStep, setCurrentStep] = useState(0);
      const [simulationState, setSimulationState] = useState(null);

      // Anthropic brand colors
      const colors = {
        dark: '#141413',
        light: '#faf9f5',
        orange: '#d97757',
        blue: '#6a9bcc',
        green: '#788c5d',
        midGray: '#b0aea5',
        lightGray: '#e8e6dc',
      };

      const modes = [
        { id: 'learn', name: 'Learning Mode', icon: BookOpen, desc: 'Step-by-step guide to elections' },
        { id: 'quick', name: 'Quick Answers', icon: Zap, desc: 'Fast facts and summaries' },
        { id: 'simulation', name: 'Simulation', icon: Users, desc: 'Experience voting firsthand' },
        { id: 'checklist', name: 'Voter Checklist', icon: CheckCircle, desc: 'What you need to vote' },
      ];

      const learningContent = [
        {
          title: 'What is an Election?',
          content: 'An election is a process where citizens vote to choose their representatives and leaders. In India, elections happen at national, state, and local levels. This democratic process ensures that the government represents the will of the people.',
          duration: '2-3 minutes'
        },
        {
          title: 'Types of Elections in India',
          content: 'India conducts three main types of elections: General Elections (for Parliament/Lok Sabha every 5 years), State Assembly Elections (for state governments), and Local Body Elections (for Municipal Corporations and Village Councils). Each has its own timeline and rules.',
          duration: '3-4 minutes'
        },
        {
          title: 'The Voting Process',
          content: 'You go to your assigned polling station with your voter ID or government-issued identification. You mark your choice on the Electronic Voting Machine (EVM) in the privacy of a voting booth, and your vote is recorded securely. Each vote is counted exactly once.',
          duration: '4-5 minutes'
        },
        {
          title: 'Counting and Results',
          content: 'After voting ends, the Election Commission secures the Electronic Voting Machines. Votes are counted by trained officials under observation. Results are declared within 24-48 hours, and the candidate with the most votes in each constituency wins.',
          duration: '3-4 minutes'
        },
      ];

      const timeline = [
        { phase: 'Pre-Election Phase', items: ['Voter Registration Opens', 'Nomination Filing Period', 'Campaign Period Begins', 'Election Date Announced'], duration: '3-4 weeks' },
        { phase: 'Election Day', items: ['Polling Stations Open at 7 AM', 'Voting Throughout the Day', 'Polling Stations Close at 6 PM', 'Machines Sealed and Secured'], duration: '1 day (up to 6 phases)' },
        { phase: 'Post-Election', items: ['Vote Counting Begins', 'Results Declared', 'Government Formation', 'Oath Ceremony'], duration: '2-7 days' },
      ];

      const quickAnswers = [
        { q: 'Who can vote?', a: 'Any Indian citizen aged 18 or older who is registered as a voter and has permanent residence.' },
        { q: 'What do I need to vote?', a: 'A valid voter ID or government-issued ID like Aadhaar, Passport, Driving License, or PAN card.' },
        { q: 'How often are elections held?', a: 'General elections are held every 5 years. State elections vary by state. Local elections are held every 5 years.' },
        { q: 'Can I vote if I\'m not at my polling station?', a: 'Yes, you can request a postal ballot if you cannot reach your assigned polling station.' },
        { q: 'Is voting compulsory?', a: 'Voting is not legally compulsory in India, but it is a crucial civic duty to participate in democracy.' },
      ];

      const checklist = [
        { item: 'Check if you are registered as a voter', status: 'critical' },
        { item: 'Find your assigned polling station', status: 'critical' },
        { item: 'Arrange a valid government-issued ID', status: 'critical' },
        { item: 'Know your assembly constituency number', status: 'important' },
        { item: 'Check the election date and voting time', status: 'important' },
        { item: 'Plan your travel to the polling station', status: 'important' },
        { item: 'Inform family/friends about election day', status: 'helpful' },
      ];

      const startSimulation = () => {
        setSimulationState({ step: 1, votes: { party1: 0, party2: 0, party3: 0 } });
      };

      const handleSimulationChoice = (choice) => {
        if (simulationState.step === 1) {
          setSimulationState({ ...simulationState, step: 2, choice: choice });
        } else if (simulationState.step === 2) {
          const newVotes = { ...simulationState.votes };
          if (choice === 'BJP') newVotes.party1++;
          else if (choice === 'Congress') newVotes.party2++;
          else newVotes.party3++;
          setSimulationState({ ...simulationState, step: 3, votes: newVotes });
        }
      };

      const renderMode = () => {
        switch (currentMode) {
          case 'learn':
            return (
              <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                <div style={{ marginBottom: '2rem' }}>
                  <h2 style={{ fontSize: '20px', fontWeight: '500', marginBottom: '1rem', color: colors.dark }}>
                    {learningContent[currentStep].title}
                  </h2>
                  <p style={{ fontSize: '16px', lineHeight: '1.7', color: colors.dark, marginBottom: '1rem' }}>
                    {learningContent[currentStep].content}
                  </p>
                  <p style={{ fontSize: '14px', color: colors.midGray }}>
                    ⏱ {learningContent[currentStep].duration}
                  </p>
                </div>

                <div style={{ display: 'flex', gap: '12px', marginBottom: '2rem' }}>
                  <button
                    onClick={() => setCurrentStep(Math.max(0, currentStep - 1))}
                    disabled={currentStep === 0}
                    style={{
                      padding: '10px 16px',
                      border: `1px solid ${colors.lightGray}`,
                      borderRadius: '6px',
                      backgroundColor: colors.light,
                      cursor: currentStep === 0 ? 'not-allowed' : 'pointer',
                      opacity: currentStep === 0 ? 0.5 : 1,
                      fontSize: '15px',
                      fontWeight: '500',
                    }}
                  >
                    ← Previous
                  </button>
                  <button
                    onClick={() => setCurrentStep(Math.min(learningContent.length - 1, currentStep + 1))}
                    disabled={currentStep === learningContent.length - 1}
                    style={{
                      padding: '10px 16px',
                      border: `1px solid ${colors.orange}`,
                      borderRadius: '6px',
                      backgroundColor: colors.light,
                      color: colors.orange,
                      cursor: currentStep === learningContent.length - 1 ? 'not-allowed' : 'pointer',
                      opacity: currentStep === learningContent.length - 1 ? 0.5 : 1,
                      fontWeight: '500',
                      fontSize: '15px',
                    }}
                  >
                    Next →
                  </button>
                </div>

                <div style={{ marginBottom: '2rem' }}>
                  <h3 style={{ fontSize: '16px', fontWeight: '500', marginBottom: '1rem', color: colors.dark }}>
                    📅 Election Timeline
                  </h3>
                  {timeline.map((phase, idx) => (
                    <div
                      key={idx}
                      style={{
                        marginBottom: '1rem',
                        padding: '12px',
                        backgroundColor: colors.lightGray,
                        borderRadius: '6px',
                        borderLeft: `4px solid ${colors.blue}`,
                      }}
                    >
                      <p style={{ fontSize: '14px', fontWeight: '500', color: colors.dark, margin: '0 0 8px 0' }}>
                        {phase.phase} ({phase.duration})
                      </p>
                      <ul style={{ margin: '0', paddingLeft: '20px', fontSize: '14px', color: colors.midGray }}>
                        {phase.items.map((item, i) => (
                          <li key={i} style={{ marginBottom: '4px' }}>{item}</li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            );

          case 'quick':
            return (
              <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                <h2 style={{ fontSize: '20px', fontWeight: '500', marginBottom: '1.5rem', color: colors.dark }}>
                  Quick Facts About Indian Elections
                </h2>
                {quickAnswers.map((qa, idx) => (
                  <div
                    key={idx}
                    style={{
                      marginBottom: '1rem',
                      padding: '1rem',
                      backgroundColor: colors.light,
                      border: `1px solid ${colors.lightGray}`,
                      borderRadius: '6px',
                    }}
                  >
                    <p style={{ fontSize: '15px', fontWeight: '500', color: colors.orange, margin: '0 0 8px 0' }}>
                      {qa.q}
                    </p>
                    <p style={{ fontSize: '14px', color: colors.dark, margin: '0' }}>
                      {qa.a}
                    </p>
                  </div>
                ))}
              </div>
            );

          case 'simulation':
            return (
              <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                {!simulationState ? (
                  <div style={{ textAlign: 'center', padding: '2rem' }}>
                    <div style={{ color: colors.orange, marginBottom: '1rem', fontSize: '48px' }}>💡</div>
                    <h2 style={{ fontSize: '20px', fontWeight: '500', color: colors.dark, marginBottom: '1rem' }}>
                      Experience a Voting Simulation
                    </h2>
                    <p style={{ fontSize: '14px', color: colors.midGray, marginBottom: '1.5rem' }}>
                      Walk through the voting process step-by-step and see what it's like to vote in an Indian election.
                    </p>
                    <button
                      onClick={startSimulation}
                      style={{
                        padding: '12px 24px',
                        backgroundColor: colors.orange,
                        color: colors.light,
                        border: 'none',
                        borderRadius: '6px',
                        cursor: 'pointer',
                        fontWeight: '500',
                        fontSize: '15px',
                      }}
                    >
                      Start Simulation
                    </button>
                  </div>
                ) : simulationState.step === 1 ? (
                  <div style={{ padding: '2rem' }}>
                    <h2 style={{ fontSize: '18px', fontWeight: '500', color: colors.dark, marginBottom: '1rem' }}>
                      🏢 Step 1: At the Polling Station
                    </h2>
                    <p style={{ fontSize: '14px', color: colors.midGray, marginBottom: '1.5rem' }}>
                      You've arrived at your polling station. What's your first step?
                    </p>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      <button
                        onClick={() => handleSimulationChoice('showID')}
                        style={{
                          padding: '12px 16px',
                          backgroundColor: colors.lightGray,
                          border: `1px solid ${colors.midGray}`,
                          borderRadius: '6px',
                          cursor: 'pointer',
                          textAlign: 'left',
                          fontSize: '15px',
                          fontWeight: '500',
                        }}
                      >
                        ✓ Show your voter ID to election officials
                      </button>
                      <button
                        onClick={() => handleSimulationChoice('ask')}
                        style={{
                          padding: '12px 16px',
                          backgroundColor: colors.lightGray,
                          border: `1px solid ${colors.midGray}`,
                          borderRadius: '6px',
                          cursor: 'pointer',
                          textAlign: 'left',
                          fontSize: '15px',
                          fontWeight: '500',
                        }}
                      >
                        ✓ Ask where your name is on the voter roll
                      </button>
                    </div>
                  </div>
                ) : simulationState.step === 2 ? (
                  <div style={{ padding: '2rem' }}>
                    <h2 style={{ fontSize: '18px', fontWeight: '500', color: colors.dark, marginBottom: '1rem' }}>
                      🗳️ Step 2: Cast Your Vote
                    </h2>
                    <p style={{ fontSize: '14px', color: colors.midGray, marginBottom: '1.5rem' }}>
                      You're now in the voting booth. You see the Electronic Voting Machine with candidates listed. Which party do you choose?
                    </p>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                      {['BJP (Bharatiya Janata Party)', 'Indian National Congress', 'Other/Independent'].map((party) => (
                        <button
                          key={party}
                          onClick={() => handleSimulationChoice(party.split(' ')[0])}
                          style={{
                            padding: '12px 16px',
                            backgroundColor: colors.lightGray,
                            border: `1px solid ${colors.midGray}`,
                            borderRadius: '6px',
                            cursor: 'pointer',
                            textAlign: 'left',
                            fontSize: '15px',
                            fontWeight: '500',
                          }}
                        >
                          {party}
                        </button>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div style={{ padding: '2rem', textAlign: 'center' }}>
                    <div style={{ color: colors.green, marginBottom: '1rem', fontSize: '48px' }}>✓</div>
                    <h2 style={{ fontSize: '18px', fontWeight: '500', color: colors.dark, marginBottom: '1rem' }}>
                      Vote Recorded Successfully!
                    </h2>
                    <p style={{ fontSize: '14px', color: colors.midGray, marginBottom: '1.5rem' }}>
                      Your vote has been securely recorded on the Electronic Voting Machine. Your participation in democracy is complete! Every vote counts and contributes to shaping the future of our nation.
                    </p>
                    <button
                      onClick={() => setSimulationState(null)}
                      style={{
                        padding: '12px 24px',
                        backgroundColor: colors.blue,
                        color: colors.light,
                        border: 'none',
                        borderRadius: '6px',
                        cursor: 'pointer',
                        fontWeight: '500',
                        fontSize: '15px',
                      }}
                    >
                      Try Another Scenario
                    </button>
                  </div>
                )}
              </div>
            );

          case 'checklist':
            return (
              <div style={{ maxWidth: '800px', margin: '0 auto' }}>
                <h2 style={{ fontSize: '20px', fontWeight: '500', marginBottom: '1.5rem', color: colors.dark }}>
                  ✓ Before You Vote: Essential Checklist
                </h2>
                {checklist.map((item, idx) => (
                  <div
                    key={idx}
                    style={{
                      display: 'flex',
                      alignItems: 'center',
                      gap: '12px',
                      padding: '12px 16px',
                      marginBottom: '10px',
                      backgroundColor: colors.light,
                      border: `1px solid ${colors.lightGray}`,
                      borderRadius: '6px',
                      borderLeft: `4px solid ${
                        item.status === 'critical' ? colors.orange : item.status === 'important' ? colors.blue : colors.green
                      }`,
                    }}
                  >
                    <div
                      style={{
                        width: '20px',
                        height: '20px',
                        borderRadius: '50%',
                        backgroundColor:
                          item.status === 'critical' ? colors.orange : item.status === 'important' ? colors.blue : colors.green,
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        flexShrink: 0,
                      }}
                    >
                      <span style={{ color: colors.light, fontSize: '12px', fontWeight: 'bold' }}>✓</span>
                    </div>
                    <span style={{ fontSize: '15px', color: colors.dark, fontWeight: '500', flex: 1 }}>
                      {item.item}
                    </span>
                    <span
                      style={{
                        fontSize: '12px',
                        padding: '4px 8px',
                        backgroundColor:
                          item.status === 'critical'
                            ? `${colors.orange}20`
                            : item.status === 'important'
                            ? `${colors.blue}20`
                            : `${colors.green}20`,
                        color:
                          item.status === 'critical' ? colors.orange : item.status === 'important' ? colors.blue : colors.green,
                        borderRadius: '4px',
                        fontWeight: '500',
                        whiteSpace: 'nowrap',
                      }}
                    >
                      {item.status === 'critical' ? '⚠️ Critical' : item.status === 'important' ? '⭐ Important' : '💡 Helpful'}
                    </span>
                  </div>
                ))}
              </div>
            );

          default:
            return null;
        }
      };

      if (!currentMode) {
        return (
          <div style={{ backgroundColor: colors.light, minHeight: '100vh', padding: '2rem' }}>
            <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
              {/* Header */}
              <div style={{ marginBottom: '3rem', textAlign: 'center' }}>
                <h1 style={{ fontSize: '32px', fontWeight: '500', color: colors.dark, margin: '0 0 12px 0' }}>
                  🇮🇳 ElectionGuide India
                </h1>
                <p style={{ fontSize: '16px', color: colors.midGray, margin: '0' }}>
                  Understand Indian elections. Learn the process. Make your voice heard.
                </p>
              </div>

              {/* Mode Selection Grid */}
              <div
                style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))',
                  gap: '16px',
                  marginBottom: '3rem',
                }}
              >
                {modes.map((mode) => {
                  const Icon = mode.icon;
                  return (
                    <button
                      key={mode.id}
                      onClick={() => {
                        setCurrentMode(mode.id);
                        setCurrentStep(0);
                      }}
                      style={{
                        padding: '1.5rem',
                        backgroundColor: colors.light,
                        border: `1px solid ${colors.lightGray}`,
                        borderRadius: '12px',
                        cursor: 'pointer',
                        textAlign: 'left',
                        transition: 'all 0.2s',
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.borderColor = colors.orange;
                        e.currentTarget.style.boxShadow = `0 0 0 3px ${colors.orange}15`;
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.borderColor = colors.lightGray;
                        e.currentTarget.style.boxShadow = 'none';
                      }}
                    >
                      <Icon size={28} style={{ color: colors.orange, marginBottom: '12px' }} />
                      <h3 style={{ fontSize: '16px', fontWeight: '500', color: colors.dark, margin: '0 0 8px 0' }}>
                        {mode.name}
                      </h3>
                      <p style={{ fontSize: '14px', color: colors.midGray, margin: '0' }}>
                        {mode.desc}
                      </p>
                    </button>
                  );
                })}
              </div>

              {/* Footer */}
              <div style={{ textAlign: 'center', padding: '2rem', backgroundColor: colors.light, borderRadius: '12px', border: `1px solid ${colors.lightGray}` }}>
                <p style={{ fontSize: '14px', color: colors.midGray, margin: '0' }}>
                  ✓ Non-partisan • Factual • Interactive • Designed for all knowledge levels
                </p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div style={{ backgroundColor: colors.light, minHeight: '100vh', padding: '2rem' }}>
          <div style={{ maxWidth: '900px', margin: '0 auto' }}>
            {/* Navigation Bar */}
            <button
              onClick={() => setCurrentMode(null)}
              style={{
                marginBottom: '2rem',
                padding: '10px 16px',
                backgroundColor: colors.light,
                border: `1px solid ${colors.lightGray}`,
                borderRadius: '6px',
                cursor: 'pointer',
                fontSize: '14px',
                fontWeight: '500',
                color: colors.dark,
              }}
            >
              ← Back to Modes
            </button>

            {/* Mode Title */}
            <h1
              style={{
                fontSize: '28px',
                fontWeight: '500',
                color: colors.dark,
                marginBottom: '2rem',
              }}
            >
              {modes.find((m) => m.id === currentMode)?.name}
            </h1>

            {/* Mode Content */}
            {renderMode()}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ElectionGuideIndia />);
  </script>
</body>
</html>
