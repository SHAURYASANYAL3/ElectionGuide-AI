<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectionGuide India</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background-color: #faf9f5; color: #141413; }
    button, input, select, textarea { font-family: inherit; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { padding: 1rem; background: #faf9f5; border: 1px solid #e8e6dc; border-radius: 8px; margin-bottom: 10px; }
    .btn { padding: 10px 16px; border-radius: 6px; border: 1px solid #e8e6dc; background: #faf9f5; cursor: pointer; }
    .btn-primary { border-color: #d97757; color: #d97757; }
    .muted { color: #b0aea5; }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const state = { mode: null, step: 0, simStep: 0 };
    const root = document.getElementById('root');

    const learningContent = [
      { title: 'What is an Election?', content: 'An election is a process where citizens vote to choose representatives and leaders. In India, elections happen at national, state, and local levels.', duration: '2-3 minutes' },
      { title: 'Types of Elections in India', content: 'India conducts General Elections, State Assembly Elections, and Local Body Elections, each with its own timeline and rules.', duration: '3-4 minutes' },
      { title: 'The Voting Process', content: 'Go to your polling station with valid ID, cast your vote on the EVM privately, and your vote is securely recorded.', duration: '4-5 minutes' },
      { title: 'Counting and Results', content: 'After voting ends, EVMs are secured and counted under observation. Results are declared after counting.', duration: '3-4 minutes' }
    ];

    function renderHome() {
      root.innerHTML = `
        <div class="container">
          <div style="text-align:center; margin-bottom:2rem;">
            <h1 style="font-size:32px; margin-bottom:10px;">🇮🇳 ElectionGuide India</h1>
            <p class="muted">Understand Indian elections. Learn the process. Make your voice heard.</p>
          </div>
          <div class="grid">
            ${[
              ['learn','📘 Learning Mode','Step-by-step guide to elections'],
              ['quick','⚡ Quick Answers','Fast facts and summaries'],
              ['simulation','🗳️ Simulation','Experience voting firsthand'],
              ['checklist','✅ Voter Checklist','What you need to vote']
            ].map(([id,name,desc]) => `<button class="card" data-mode="${id}" style="text-align:left; cursor:pointer;"><h3 style="margin-bottom:8px;">${name}</h3><p class="muted">${desc}</p></button>`).join('')}
          </div>
        </div>`;
      root.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => { state.mode = btn.dataset.mode; state.step = 0; state.simStep = 0; render(); });
    }

    function renderLearn() {
      const c = learningContent[state.step];
      return `
        <h2 style="margin-bottom:1rem;">${c.title}</h2>
        <p style="line-height:1.7; margin-bottom:0.8rem;">${c.content}</p>
        <p class="muted">⏱ ${c.duration}</p>
        <div style="display:flex; gap:12px; margin:1rem 0 2rem;">
          <button class="btn" id="prevBtn" ${state.step===0?'disabled':''}>← Previous</button>
          <button class="btn btn-primary" id="nextBtn" ${state.step===learningContent.length-1?'disabled':''}>Next →</button>
        </div>`;
    }

    function renderQuick() {
      const qa = [
        ['Who can vote?','Any Indian citizen aged 18+ who is registered as a voter.'],
        ['What do I need to vote?','A valid voter ID or other approved government-issued ID.'],
        ['How often are elections held?','General elections are every 5 years; state and local schedules vary.']
      ];
      return '<h2 style="margin-bottom:1rem;">Quick Facts</h2>' + qa.map(([q,a]) => `<div class="card"><p style="color:#d97757;font-weight:600;margin-bottom:6px;">${q}</p><p>${a}</p></div>`).join('');
    }

    function renderSimulation() {
      if (state.simStep === 0) return '<h2>Voting Simulation</h2><p class="muted" style="margin:1rem 0;">Walk through a simplified voting flow.</p><button class="btn btn-primary" id="startSim">Start Simulation</button>';
      if (state.simStep === 1) return '<h2>Step 1</h2><p class="muted" style="margin:1rem 0;">Show ID and verify your details with polling staff.</p><button class="btn btn-primary" id="nextSim">Continue</button>';
      return '<h2>✅ Vote Recorded</h2><p class="muted" style="margin:1rem 0;">Your vote has been recorded securely.</p><button class="btn" id="resetSim">Try Again</button>';
    }

    function renderChecklist() {
      const items = ['Check voter registration','Find polling station','Carry valid ID','Confirm election date/time'];
      return '<h2 style="margin-bottom:1rem;">Before You Vote</h2>' + items.map(i => `<div class="card">✅ ${i}</div>`).join('');
    }

    function renderMode() {
      const map = { learn: renderLearn, quick: renderQuick, simulation: renderSimulation, checklist: renderChecklist };
      root.innerHTML = `
        <div class="container" style="max-width:900px;">
          <button class="btn" id="backBtn" style="margin-bottom:1rem;">← Back to Modes</button>
          ${map[state.mode] ? map[state.mode]() : ''}
        </div>`;
      document.getElementById('backBtn').onclick = () => { state.mode = null; render(); };
      if (state.mode === 'learn') {
        const p = document.getElementById('prevBtn');
        const n = document.getElementById('nextBtn');
        if (p) p.onclick = () => { state.step = Math.max(0, state.step - 1); render(); };
        if (n) n.onclick = () => { state.step = Math.min(learningContent.length - 1, state.step + 1); render(); };
      }
      if (state.mode === 'simulation') {
        const s = document.getElementById('startSim');
        const n = document.getElementById('nextSim');
        const r = document.getElementById('resetSim');
        if (s) s.onclick = () => { state.simStep = 1; render(); };
        if (n) n.onclick = () => { state.simStep = 2; render(); };
        if (r) r.onclick = () => { state.simStep = 0; render(); };
      }
    }

    function render() { state.mode ? renderMode() : renderHome(); }
    render();
  </script>
</body>
</html>
