<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectionGuide India</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background-color: #faf9f5; color: #141413; }
    button, input, select, textarea { font-family: inherit; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .card { padding: 1rem; background: #faf9f5; border: 1px solid #e8e6dc; border-radius: 8px; margin-bottom: 10px; }
    .btn { padding: 10px 16px; border-radius: 6px; border: 1px solid #e8e6dc; background: #faf9f5; cursor: pointer; }
    .btn-primary { border-color: #d97757; color: #d97757; }
    .muted { color: #b0aea5; }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
    if (!window.React || !window.ReactDOM) {
      throw new Error("React/ReactDOM failed to load before app initialization.");
    }
    const React = window.React;
    const ReactDOM = window.ReactDOM;
    const { useState } = React;
    const { ChevronRight, MapPin, Clock, CheckCircle, BookOpen, Zap, Users, Lightbulb } = lucide;

    function ElectionGuideIndia() {
      const [currentMode, setCurrentMode] = useState(null);
      const [currentStep, setCurrentStep] = useState(0);
      const [simulationState, setSimulationState] = useState(null);

      // Anthropic brand colors
      const colors = {
        dark: '#141413',
        light: '#faf9f5',
        orange: '#d97757',
        blue: '#6a9bcc',
        green: '#788c5d',
        midGray: '#b0aea5',
        lightGray: '#e8e6dc',
      };

      const modes = [
        { id: 'learn', name: 'Learning Mode', icon: BookOpen, desc: 'Step-by-step guide to elections' },
        { id: 'quick', name: 'Quick Answers', icon: Zap, desc: 'Fast facts and summaries' },
        { id: 'simulation', name: 'Simulation', icon: Users, desc: 'Experience voting firsthand' },
        { id: 'checklist', name: 'Voter Checklist', icon: CheckCircle, desc: 'What you need to vote' },
      ];

      const learningContent = [
        {
          title: 'What is an Election?',
          content: 'An election is a process where citizens vote to choose their representatives and leaders. In India, elections happen at national, state, and local levels. This democratic process ensures that the government represents the will of the people.',
          duration: '2-3 minutes'
        },
        {
          title: 'Types of Elections in India',
          content: 'India conducts three main types of elections: General Elections (for Parliament/Lok Sabha every 5 years), State Assembly Elections (for state governments), and Local Body Elections (for Municipal Corporations and Village Councils). Each has its own timeline and rules.',
          duration: '3-4 minutes'
        },
        {
          title: 'The Voting Process',
          content: 'You go to your assigned polling station with your voter ID or government-issued identification. You mark your choice on the Electronic Voting Machine (EVM) in the privacy of a voting booth, and your vote is recorded securely. Each vote is counted exactly once.',
          duration: '4-5 minutes'
        },
        {
          title: 'Counting and Results',
          content: 'After voting ends, the Election Commission secures the Electronic Voting Machines. Votes are counted by trained officials under observation. Results are declared within 24-48 hours, and the candidate with the most votes in each constituency wins.',
          duration: '3-4 minutes'
        },
      ];

      const timeline = [
        { phase: 'Pre-Election Phase', items: ['Voter Registration Opens', 'Nomination Filing Period', 'Campaign Period Begins', 'Election Date Announced'], duration: '3-4 weeks' },
        { phase: 'Election Day', items: ['Polling Stations Open at 7 AM', 'Voting Throughout the Day', 'Polling Stations Close at 6 PM', 'Machines Sealed and Secured'], duration: '1 day (up to 6 phases)' },
        { phase: 'Post-Election', items: ['Vote Counting Begins', 'Results Declared', 'Government Formation', 'Oath Ceremony'], duration: '2-7 days' },
      ];

    function renderLearn() {
      const c = learningContent[state.step];
      return `
        <h2 style="margin-bottom:1rem;">${c.title}</h2>
        <p style="line-height:1.7; margin-bottom:0.8rem;">${c.content}</p>
        <p class="muted">⏱ ${c.duration}</p>
        <div style="display:flex; gap:12px; margin:1rem 0 2rem;">
          <button class="btn" id="prevBtn" ${state.step===0?'disabled':''}>← Previous</button>
          <button class="btn btn-primary" id="nextBtn" ${state.step===learningContent.length-1?'disabled':''}>Next →</button>
        </div>`;
    }

    function renderQuick() {
      const qa = [
        ['Who can vote?','Any Indian citizen aged 18+ who is registered as a voter.'],
        ['What do I need to vote?','A valid voter ID or other approved government-issued ID.'],
        ['How often are elections held?','General elections are every 5 years; state and local schedules vary.']
      ];
      return '<h2 style="margin-bottom:1rem;">Quick Facts</h2>' + qa.map(([q,a]) => `<div class="card"><p style="color:#d97757;font-weight:600;margin-bottom:6px;">${q}</p><p>${a}</p></div>`).join('');
    }

    function renderSimulation() {
      if (state.simStep === 0) return '<h2>Voting Simulation</h2><p class="muted" style="margin:1rem 0;">Walk through a simplified voting flow.</p><button class="btn btn-primary" id="startSim">Start Simulation</button>';
      if (state.simStep === 1) return '<h2>Step 1</h2><p class="muted" style="margin:1rem 0;">Show ID and verify your details with polling staff.</p><button class="btn btn-primary" id="nextSim">Continue</button>';
      return '<h2>✅ Vote Recorded</h2><p class="muted" style="margin:1rem 0;">Your vote has been recorded securely.</p><button class="btn" id="resetSim">Try Again</button>';
    }

    function renderChecklist() {
      const items = ['Check voter registration','Find polling station','Carry valid ID','Confirm election date/time'];
      return '<h2 style="margin-bottom:1rem;">Before You Vote</h2>' + items.map(i => `<div class="card">✅ ${i}</div>`).join('');
    }

    function renderMode() {
      const map = { learn: renderLearn, quick: renderQuick, simulation: renderSimulation, checklist: renderChecklist };
      root.innerHTML = `
        <div class="container" style="max-width:900px;">
          <button class="btn" id="backBtn" style="margin-bottom:1rem;">← Back to Modes</button>
          ${map[state.mode] ? map[state.mode]() : ''}
        </div>`;
      document.getElementById('backBtn').onclick = () => { state.mode = null; render(); };
      if (state.mode === 'learn') {
        const p = document.getElementById('prevBtn');
        const n = document.getElementById('nextBtn');
        if (p) p.onclick = () => { state.step = Math.max(0, state.step - 1); render(); };
        if (n) n.onclick = () => { state.step = Math.min(learningContent.length - 1, state.step + 1); render(); };
      }
      if (state.mode === 'simulation') {
        const s = document.getElementById('startSim');
        const n = document.getElementById('nextSim');
        const r = document.getElementById('resetSim');
        if (s) s.onclick = () => { state.simStep = 1; render(); };
        if (n) n.onclick = () => { state.simStep = 2; render(); };
        if (r) r.onclick = () => { state.simStep = 0; render(); };
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ElectionGuideIndia />);
  </script>
</body>
</html>
